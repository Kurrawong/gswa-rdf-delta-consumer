# https://taskfile.dev

version: "3"

dotenv: [".env"]

tasks:
  default:
    cmd: task -a

  clean:
    desc: Clean the venv
    cmds:
      - rm -rf .venv
      - python -m venv .venv
    ignore_error: true

  install:
    desc: Set up the venv and install python dependencies
    cmds:
      - .venv/bin/pip install -r requirements.txt
      - .venv/bin/pip install -r requirements-dev.txt

  code:
    desc: Run the code linting and formatting
    cmds:
      - .venv/bin/ruff format
      - .venv/bin/ruff check --fix

  dev:
    desc: Run the function app in dev mode
    cmd: func start -p 7072

  test:
    desc: Run the tests
    cmd: .venv/bin/pytest

  sendPatchToServiceBus:
    desc: send a patch to remote service bus instance
    cmds:
      - .venv/bin/python sb_producer.py input default test_data.trig --ws

  deploy:
    desc: Deploy the function app to azure
    cmd: func azure functionapp publish ${EPC_APP_NAME}
